<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />    
    <link rel="stylesheet" href="src/scss/styles.css">
    <title>Acortador de enlaces</title>
    <link rel="icon" type="image/x-icon" href="src/img/favicon.ico">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="shortener-icon">
                <img src="src/img/default.png" alt="">
            </div>

            <div class="shortener-form">
                <p>&#xf0c1;&nbsp; Acortador de URL &nbsp;&#xf127;</p>
                <span id="subtitle">Ingresa el enlace que deseas acortar:</span>
                <div class="input-group">
                    <input type="text" pattern="www.*|http://.*|https://.*" class="form-control" id="url" placeholder="https://www.ejemplo.com" required >
                </div> 
                <button class="btn btn-dark" id="shorten-btn">Acortar | &#xf0c4;</button>  
                <button class="btn btn-dark" id="reload">Deshacer | &#xf55a;</button>     
            </div>

            <div class="shortener-result">                
                <div class="shortener-url"  ></div>
                <button class="btn btn-danger" id="copy-url" title="Copiar">Copiar | &#xf24d;</button>
            </div>          
        </div>        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script src="src/js/main.js"></script>
</body>
</html>
